name: 🚀 Feature Request
description: Suggest a new feature or an improvement.
title: "Feature Request: "
labels: [enhancement]
assignees:
  - seydx
body:
  - type: markdown
    attributes:
      value: |
        Please search the [existing requests](https://github.com/cameraui/camera.ui/issues?q=label%3Aenhancement) first and add a 👍 to the one that fits. One idea per request, in your own words, see the [AI policy](https://github.com/cameraui/camera.ui/blob/master/AI_POLICY.md).

        Asking for a camera brand? Name the models and how they connect today: ONVIF, RTSP, or only the vendor's app or cloud.

  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The situation and what you want to achieve. Describe the need, not only the solution.
      placeholder: I want to ... so that ...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for camera.ui. Mockups or examples from other apps help.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: What you do today instead, links, screenshots.
