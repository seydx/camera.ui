name: 🐞 Bug Report
description: Something in camera.ui doesn't work as it should.
title: "Bug: "
labels: [bug]
assignees:
  - seydx
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        - Questions and setup help go to [Discussions](https://github.com/cameraui/camera.ui/discussions/new?category=q-a) or [Discord](https://discord.gg/bBGnGcbz8N).
        - Bugs in an official plugin (HomeKit, Reolink, Eufy, ...) go to [cameraui/plugins](https://github.com/cameraui/plugins/issues).
        - Please write the report yourself, see the [AI policy](https://github.com/cameraui/camera.ui/blob/master/AI_POLICY.md).

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: The steps that lead to the problem. If it happens on its own, since when and how often?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: camera.ui version
      description: Shown under **Settings → System**. For a problem in an app, add the app version too.
      placeholder: 2.4.0
    validations:
      required: true

  - type: input
    id: last-working
    attributes:
      label: Last version that worked
      description: If it worked before, the last version where it did.

  - type: dropdown
    id: installation
    attributes:
      label: Server installation
      options:
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Desktop app (Linux)
        - Docker
        - Proxmox
        - Linux (bare-metal)
        - Home Assistant app
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Where do you see it?
      multiple: true
      options:
        - Web browser
        - Desktop app
        - iPhone or iPad app
        - Android app
        - Apple TV app
        - Home Assistant
        - Only on the server, no app involved
    validations:
      required: true

  - type: input
    id: devices
    attributes:
      label: Camera, device and browser
      description: Whatever is involved, for example the camera model and how it was added, or the phone and its OS version.
      placeholder: Reolink RLC-811A via ONVIF, iPhone 16 on iOS 26.1

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server: **Logs** in the menu, copy the lines around the problem or download the log.
        App: the **Console** export, with **Record logs** on in **Settings → Appearance**.
        Remove passwords, tokens and public addresses before posting.
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a screen recording, or for remote access problems the **Copy details** text from **Settings → Remote Access**.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find this one.
          required: true
        - label: The problem still happens on the latest release or beta.
          required: true
